# 根目录 pytest 配置：让 `pytest`（不带参数）能从仓库根目录一次跑完两个套件。
#
# 说明：backend/ 与 ai-ecommerce-assistant/ 各自还有 pytest.ini，CI 分目录执行时
# 以各自目录为 rootdir 并读取那份配置；本文件只在从仓库根目录执行时生效。
#
# 关键：asyncio 事件循环必须是 session 级。backend.database.engine 是模块级全局
# 对象，连接池里的 aiomysql 连接绑定在创建它的事件循环上。若每个测试新建 loop，
# 后续测试会拿到"属于另一个 loop"的连接并抛：
#     RuntimeError: Task ... got Future attached to a different loop
# 从根目录跑且缺少本文件时，pytest-asyncio 退回 function 级 loop，且 ai 套件先于
# backend 执行，稳定导致 backend/tests/test_api.py 的 7 项失败。
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = ai-ecommerce-assistant/tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
